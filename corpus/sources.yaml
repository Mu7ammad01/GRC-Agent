# Corpus réglementaire indexé dans Chroma.
# - url présente : téléchargé automatiquement par `make corpus` dans corpus/raw/
# - url absente  : déposer le fichier à la main dans corpus/raw/ sous le nom indiqué
# norm_level : 1 règlement UE · 2 directive UE · 3 loi luxembourgeoise · 4 CSSF · 5 interne

documents:
  - id: REG-DORA
    title: "Règlement (UE) 2022/2554 — DORA"
    norm_level: 1
    url: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32022R2554"
    file: dora_fr.html

  - id: REG-AIACT
    title: "Règlement (UE) 2024/1689 — AI Act"
    norm_level: 1
    url: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32024R1689"
    file: ai_act_fr.html

  - id: REG-C12552
    title: "Circulaire CSSF 12/552 (version coordonnée)"
    norm_level: 4
    file: cssf_12_552.pdf        # à télécharger depuis cssf.lu

  - id: REG-R1202
    title: "Règlement CSSF n° 12-02 (version coordonnée)"
    norm_level: 4
    file: cssf_reglement_12_02.pdf   # à télécharger depuis cssf.lu

  - id: REG-L2004
    title: "Loi du 12 novembre 2004 relative à la lutte contre le blanchiment et contre le financement du terrorisme"
    norm_level: 3
    file: loi_12_novembre_2004.pdf   # à télécharger depuis legilux.public.lu

# Politiques internes fictives de la BEL (versionnées dans le dépôt)
policies_dir: data/policies
